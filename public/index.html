<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08130f" />
    <meta
      name="description"
      content="Sandbox local de reconocimiento de voz con Whistle"
    />
    <link rel="stylesheet" href="./src/style.css" />
    <title>Whistle Web Sandbox</title>
  </head>
  <body>
    <main class="shell">
      <section class="voice-panel" aria-label="Grabador de voz">
        <div class="record-control">
          <div class="record-rings" aria-hidden="true"></div>
          <button
            id="recordButton"
            class="record-button"
            type="button"
            aria-label="Mantener presionado para grabar"
            aria-pressed="false"
            disabled
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 15.25a3.75 3.75 0 0 0 3.75-3.75V6a3.75 3.75 0 0 0-7.5 0v5.5A3.75 3.75 0 0 0 12 15.25Z" />
              <path d="M5.75 10.75v.75a6.25 6.25 0 0 0 12.5 0v-.75M12 17.75V21M9 21h6" />
            </svg>
          </button>
        </div>

        <p id="transcript" class="transcript" aria-live="polite">
          Mantén presionado para hablar
        </p>
        <p id="statusText" class="status" aria-live="polite">Iniciando...</p>
      </section>

      <section class="test-panel" aria-labelledby="test-panel-title">
        <header class="test-header">
          <h2 id="test-panel-title">Banco de pruebas</h2>
        </header>

        <div class="test-grid">
          <article class="test-module">
            <h3>Luces</h3>
            <div class="lights" aria-label="Estado de las luces">
              <button class="light-toggle" type="button" data-room="living" aria-pressed="false">
                <span data-light-icon aria-hidden="true">⚫</span>
                Living
              </button>
              <button class="light-toggle" type="button" data-room="cocina" aria-pressed="false">
                <span data-light-icon aria-hidden="true">⚫</span>
                Cocina
              </button>
              <button class="light-toggle" type="button" data-room="jardin" aria-pressed="false">
                <span data-light-icon aria-hidden="true">⚫</span>
                Jardín
              </button>
            </div>
          </article>

          <article class="test-module">
            <h3>Temporizador</h3>
            <output id="timerDisplay" class="timer-display" aria-live="polite">00:00</output>
            <p id="timerStatus" class="module-status">Apagado</p>
            <button id="cancelTimerButton" class="module-action" type="button" disabled>
              Cancelar
            </button>
          </article>

          <article class="test-module">
            <h3>Notas</h3>
            <ul id="notesList" class="notes-list">
              <li id="notesEmpty" class="empty-state">Sin notas</li>
            </ul>
          </article>
        </div>

        <textarea
          id="commandLog"
          class="command-log"
          rows="3"
          placeholder="Sin comandos interpretados"
          spellcheck="false"
          readonly
        ></textarea>
      </section>
    </main>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
